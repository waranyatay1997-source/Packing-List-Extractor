<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huawei PL Extractor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root {
    --navy:   #1a2744;
    --navy2:  #243259;
    --steel:  #4a5568;
    --silver: #8898aa;
    --border: #d1d9e0;
    --bg:     #f7f8fa;
    --white:  #ffffff;
    --accent: #1a2744;
    --green:  #1a6e36;
    --red:    #c0392b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: #1a202c; min-height: 100vh; }

  /* Header */
  .header {
    background: var(--navy);
    padding: 0 2.5rem;
    height: 56px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header-brand { display: flex; align-items: center; gap: 10px; }
  .header-brand svg { width: 22px; height: 22px; fill: none; stroke: #7eb3ff; stroke-width: 2; }
  .header-title { font-size: 14px; font-weight: 600; color: #fff; letter-spacing: .3px; }
  .header-sub { font-size: 11px; color: #7eb3ff; font-weight: 400; }

  /* Main layout */
  .main { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

  /* Drop zone */
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 10px;
    background: var(--white);
    padding: 3rem 2rem;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    margin-bottom: 1.5rem;
  }
  .drop-zone:hover, .drop-zone.over { border-color: var(--navy); background: #f0f4ff; }
  .drop-zone .dz-icon { font-size: 40px; margin-bottom: .75rem; }
  .drop-zone h3 { font-size: 15px; font-weight: 600; color: var(--navy); margin-bottom: .3rem; }
  .drop-zone p { font-size: 13px; color: var(--silver); }
  #file-input { display: none; }

  /* File chips */
  .file-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1rem; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: #eef1f8; border: 1px solid #ccd3e0;
    border-radius: 6px; padding: 4px 10px; font-size: 12px; color: var(--navy2);
  }
  .chip .rm { cursor: pointer; color: var(--silver); font-size: 13px; }
  .chip .rm:hover { color: var(--red); }

  /* Buttons */
  .btn-row { display: flex; gap: 8px; margin-bottom: 1.5rem; }
  .btn {
    padding: 9px 20px; border-radius: 7px; border: none;
    cursor: pointer; font-size: 13px; font-weight: 500;
    font-family: 'Inter', sans-serif; transition: background .12s, opacity .12s;
  }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--navy2); }
  .btn-ghost { background: #fff; color: var(--steel); border: 1px solid var(--border); }
  .btn-ghost:hover:not(:disabled) { background: var(--bg); }

  /* Status */
  #status { font-size: 12px; color: var(--silver); min-height: 18px; margin-bottom: .75rem; }

  /* Progress */
  .progress-wrap { height: 4px; background: #e2e8f0; border-radius: 99px; margin-bottom: 1.5rem; overflow: hidden; display: none; }
  .progress-bar { height: 4px; background: var(--navy); border-radius: 99px; transition: width .3s; width: 0%; }

  /* Results */
  #results-section { display: none; }
  .results-header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: .75rem;
  }
  .results-header h2 { font-size: 15px; font-weight: 600; color: var(--navy); }
  .badge {
    font-size: 11px; font-weight: 500; background: #eef1f8;
    color: var(--navy2); border-radius: 5px; padding: 2px 8px; margin-left: 8px;
  }

  /* Table */
  .table-wrap { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 1.5rem; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead { background: var(--navy); }
  thead th {
    padding: 11px 16px; text-align: left;
    font-size: 11px; font-weight: 600; color: #c8d8f0;
    letter-spacing: .4px; white-space: nowrap;
  }
  thead th.num { text-align: right; }
  tbody tr { border-bottom: 1px solid #edf0f5; background: var(--white); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #f7f9ff; }
  tbody td { padding: 10px 16px; color: #2d3748; vertical-align: middle; }
  tbody td.mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--navy2); }
  tbody td.num { text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  tbody td.remark { font-weight: 500; color: #1a202c; }

  /* Total row */
  .total-bar {
    background: var(--navy);
    border-radius: 8px;
    padding: 14px 20px;
    display: flex; gap: 3rem; align-items: center;
  }
  .total-item { display: flex; flex-direction: column; gap: 3px; }
  .total-label { font-size: 10px; font-weight: 600; color: #7eb3ff; letter-spacing: .5px; text-transform: uppercase; }
  .total-value { font-size: 20px; font-weight: 700; color: #fff; font-family: 'JetBrains Mono', monospace; }
  .total-unit { font-size: 12px; color: #7eb3ff; font-weight: 400; }
  .total-divider { width: 1px; height: 36px; background: rgba(255,255,255,.15); }
  .total-count { font-size: 12px; color: #7eb3ff; margin-left: auto; }
</style>
</head>
<body>

<header class="header">
  <div class="header-brand">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    <div>
      <div class="header-title">Packing List Extractor</div>
      <div class="header-sub">Huawei / Western Digital</div>
    </div>
  </div>
</header>

<main class="main">
  <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
    <div class="dz-icon">📄</div>
    <h3>Drop PDF files here</h3>
    <p>หรือคลิกเพื่อเลือกไฟล์ — รองรับหลายไฟล์พร้อมกัน</p>
  </div>
  <input type="file" id="file-input" accept=".pdf" multiple>

  <div class="file-list" id="file-list"></div>

  <div class="btn-row">
    <button class="btn btn-primary" id="extract-btn" disabled onclick="extractAll()">▶ ดึงข้อมูล</button>
    <button class="btn btn-ghost" onclick="clearAll()">ล้างทั้งหมด</button>
  </div>

  <div id="status"></div>
  <div class="progress-wrap" id="progress-wrap">
    <div class="progress-bar" id="progress-bar"></div>
  </div>

  <div id="results-section">
    <div class="results-header">
      <h2>ผลลัพธ์ <span class="badge" id="row-badge"></span></h2>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>PL#</th>
            <th>REMARK</th>
            <th class="num">GROSS WGT (kg)</th>
            <th class="num">NET WGT (kg)</th>
          </tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
    </div>
    <div class="total-bar" id="total-bar">
      <div class="total-item">
        <span class="total-label">Total Gross Weight</span>
        <span class="total-value" id="total-gross">—</span>
        <span class="total-unit">kg</span>
      </div>
      <div class="total-divider"></div>
      <div class="total-item">
        <span class="total-label">Total Net Weight</span>
        <span class="total-value" id="total-net">—</span>
        <span class="total-unit">kg</span>
      </div>
      <span class="total-count" id="total-count"></span>
    </div>
  </div>
</main>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let files = [];
let results = [];

// ── Drop zone ──
const dz = document.getElementById('drop-zone');
const fi = document.getElementById('file-input');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('over'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('over'); addFiles([...e.dataTransfer.files].filter(f => f.type === 'application/pdf')); });
fi.addEventListener('change', e => { addFiles([...e.target.files]); fi.value = ''; });

function addFiles(newFiles) {
  newFiles.forEach(f => { if (!files.find(x => x.name === f.name)) files.push(f); });
  renderFiles();
}
function removeFile(i) { files.splice(i, 1); renderFiles(); }
function renderFiles() {
  const fl = document.getElementById('file-list');
  fl.innerHTML = '';
  files.forEach((f, i) => {
    const s = document.createElement('span'); s.className = 'chip';
    s.innerHTML = \`📄 \${f.name} <span class="rm" onclick="removeFile(\${i})">✕</span>\`;
    fl.appendChild(s);
  });
  document.getElementById('extract-btn').disabled = files.length === 0;
  if (!files.length) { document.getElementById('results-section').style.display = 'none'; results = []; }
}
function clearAll() { files = []; results = []; renderFiles(); document.getElementById('status').textContent = ''; document.getElementById('progress-wrap').style.display = 'none'; }

// ── PDF text extraction ──
async function extractText(file) {
  const ab = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: ab }).promise;
  let text = '';
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    text += content.items.map(i => i.str).join(' ') + '\n';
  }
  return text;
}

// ── Parse PL data ──
function parsePL(text) {
  // PL#
  const plMatch = text.match(/PL#[:\s]+([A-Z0-9\-]+(?:-PL)?)/i);
  const pl = plMatch ? plMatch[1].replace(/\s/g,'') : '-';

  // REMARK — look for a standalone 7-digit number
  const remarkMatch = text.match(/\d+x\d+x\d+\s+(\d{7})/)
    || text.match(/\b(4\d{6})\b/);
  const remark = remarkMatch ? remarkMatch[1] : '-';

  // GROSS WGT — "GROSS WGT 27.8kg" or "13.9kg" near GROSS
  // Prefer TOTAL gross (e.g. "GROSS WGT 27.8kg" in TOTAL section)
  const grossMatch = text.match(/TOTAL[\s\S]{0,200}GROSS\s+WGT\s+(\d+\.?\d*)\s*kg/i)
    || text.match(/GROSS\s+WGT\s+(\d+\.?\d*)\s*kg/i);
  const gross = grossMatch ? parseFloat(grossMatch[1]) : null;

  // NET WGT
  const netMatch = text.match(/NET\s+WGT[^\d]*(\d+\.?\d*)\s*kg/i)
    || text.match(/NET[^\d]*(\d+\.?\d*)\s*kg/i);
  const net = netMatch ? parseFloat(netMatch[1]) : null;

  return { pl, remark, gross, net, filename: '' };
}

// ── Main extract ──
async function extractAll() {
  results = [];
  document.getElementById('extract-btn').disabled = true;
  document.getElementById('results-section').style.display = 'none';
  document.getElementById('progress-wrap').style.display = 'block';
  document.getElementById('progress-bar').style.width = '0%';

  for (let i = 0; i < files.length; i++) {
    document.getElementById('status').textContent = \`กำลังอ่าน \${i+1}/\${files.length}: \${files[i].name}\`;
    document.getElementById('progress-bar').style.width = ((i / files.length) * 100) + '%';
    try {
      const text = await extractText(files[i]);
      const parsed = parsePL(text);
      parsed.filename = files[i].name;
      results.push(parsed);
    } catch(e) {
      results.push({ pl: 'Error', remark: e.message, gross: null, net: null, filename: files[i].name });
    }
  }

  document.getElementById('progress-bar').style.width = '100%';
  document.getElementById('status').textContent = \`เสร็จ — พบข้อมูล \${results.length} ไฟล์\`;
  document.getElementById('extract-btn').disabled = false;
  renderResults();
}

function renderResults() {
  const tbody = document.getElementById('results-body');
  tbody.innerHTML = '';
  let totalGross = 0, totalNet = 0;

  results.forEach(r => {
    const tr = document.createElement('tr');
    const g = r.gross !== null ? r.gross.toFixed(1) : '-';
    const n = r.net   !== null ? r.net.toFixed(2)   : '-';
    tr.innerHTML = \`
      <td class="mono">\${r.pl}</td>
      <td class="remark">\${r.remark}</td>
      <td class="num">\${g}</td>
      <td class="num">\${n}</td>\`;
    tbody.appendChild(tr);
    if (r.gross) totalGross += r.gross;
    if (r.net)   totalNet   += r.net;
  });

  document.getElementById('row-badge').textContent = results.length + ' รายการ';
  document.getElementById('total-gross').textContent = totalGross.toFixed(1);
  document.getElementById('total-net').textContent   = totalNet.toFixed(2);
  document.getElementById('total-count').textContent = results.length + ' files';
  document.getElementById('results-section').style.display = 'block';
}
</script>
</body>
</html>
